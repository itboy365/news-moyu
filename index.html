<script>
(function () {
    try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
            return;
        }
    } catch (e) {}
    try {
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
})();
</script>

const API_BASE = 'https://60s-api.itboy.top';
const REFRESH_INTERVAL = 10 * 60 * 1000;

const abortMap = new Map();

document.addEventListener('mousemove', (e) => {
    document.documentElement.style.setProperty('--mx', e.clientX + 'px');
    document.documentElement.style.setProperty('--my', e.clientY + 'px');
});

document.getElementById('theme-toggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
});

function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
}

const CARDS = [
    { id: 'moyu', type: 'moyu', url: '/v2/moyu', refreshable: false },
    { id: 'news', type: 'news', url: '/v2/60s',  refreshable: true  },
];

document.addEventListener('DOMContentLoaded', () => {
    refreshAll();
    startAutoRefresh();
});

function refreshAll() { CARDS.forEach(loadCard); }

function startAutoRefresh() {
    setInterval(() => {
        CARDS.filter(c => c.refreshable).forEach(loadCard);
    }, REFRESH_INTERVAL);
}

window.manualRefresh = function(id) {
    const card = CARDS.find(c => c.id === id);
    if (!card) return;
    const body = document.getElementById(`body-${id}`);
    if (body) {
        body.innerHTML = `
            <div class="space-y-3 py-2">
                <div class="skeleton-line w-3/4"></div>
                <div class="skeleton-line w-full"></div>
                <div class="skeleton-line w-5/6"></div>
            </div>`;
    }
    loadCard(card);
};

async function loadCard(card) {
    const body = document.getElementById(`body-${card.id}`);
    if (!body) return;

    if (abortMap.has(card.id)) { abortMap.get(card.id).abort(); abortMap.delete(card.id); }
    const ctrl = new AbortController();
    abortMap.set(card.id, ctrl);
    const timer = setTimeout(() => ctrl.abort(), 9000);

    try {
        const qs = new URLSearchParams({ t: Date.now() }).toString();
        const res = await fetch(`${API_BASE}${card.url}?${qs}`, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        const data = json.data !== undefined ? json.data : json;
        renderCard(card, data, body);
    } catch (e) {
        clearTimeout(timer);
        if (e.name !== 'AbortError') { body.innerHTML = errorHtml(card.id); }
    } finally { abortMap.delete(card.id); }
}

function errorHtml(id) {
    return `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 0;color:var(--text-4);">
            <svg width="24" height="24" fill="none" stroke="var(--err-icon)" viewBox="0 0 24 24" stroke-width="1.8" style="margin-bottom:8px;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <p style="font-size:12px;margin:0 0 8px;">加载失败</p>
            <button onclick="manualRefresh('${id}')" style="background:none;border:none;color:#22d3ee;font-size:12px;cursor:pointer;text-decoration:underline;">点击重试</button>
        </div>`;
}

function renderCard(card, data, body) {
    switch (card.type) {
        case 'moyu': return renderMoyu(data, body);
        case 'news': return renderNews(data, body);
    }
}

function renderMoyu(data, body) {
    const date = data.date || {};
    const progress = data.progress || {};
    const nextHoliday = data.nextHoliday || {};
    const nextWeekend = data.nextWeekend || {};
    const weekday = date.weekday || '';
    const mood = moodText(weekday, nextWeekend.daysUntil);

    const bar = (label, val, cls) => `
        <div class="prog-item">
            <div class="prog-row">
                <span>${escapeHtml(label)}</span>
                <b>${Number(val) || 0}%</b>
            </div>
            <div class="prog-track">
                <div class="prog-fill ${cls}" style="width:${Math.min(100, Math.max(0, Number(val) || 0))}%"></div>
            </div>
        </div>`;

    body.innerHTML = `
        <div class="fade-up">
            <div class="moyu-date">
                <div class="moyu-gregorian">
                    ${escapeHtml(date.gregorian || '')}
                    <span class="moyu-weekday">${escapeHtml(weekday)}</span>
                </div>
                <div class="moyu-lunar">
                    农历${escapeHtml(date.lunar?.monthCN || '')}${escapeHtml(date.lunar?.dayCN || '')}
                    · ${escapeHtml(date.lunar?.yearGanZhi || '')}${escapeHtml(date.lunar?.zodiac || '')}年
                </div>
                <div class="moyu-mood">${escapeHtml(mood)}</div>
            </div>

            ${bar('本周进度', progress.week?.percentage, 'cyan')}
            ${bar('本月进度', progress.month?.percentage, 'violet')}
            ${bar('今年进度', progress.year?.percentage, 'pink')}

            <div class="moyu-counters">
                <div class="counter orange">
                    <div class="counter-label">距离周末</div>
                    <div class="counter-num">${Number(nextWeekend.daysUntil) || 0}<span class="counter-unit">天</span></div>
                </div>
                <div class="counter green">
                    <div class="counter-label">距离${escapeHtml(nextHoliday.name || '假期')}</div>
                    <div class="counter-num">${Number(nextHoliday.until) || 0}<span class="counter-unit">天</span></div>
                </div>
            </div>
        </div>`;
}

function moodText(weekday, daysUntilWeekend) {
    const map = {
        '周一': '新的一周，摸鱼要有节奏感 ☕',
        '周二': '坚持一下，周末在慢慢靠近 🐌',
        '周三': '一周过半，小周末快乐 🎉',
        '周四': '马上就到周五啦，稳住 🧘',
        '周五': daysUntilWeekend <= 0 ? '周末在向你招手，冲！🎊' : '周五了，摸鱼进入冲刺阶段 🚀',
        '周六': '周末时光，好好享受 🌿',
        '周日': '明天又是新的一周，珍惜当下 🌅',
    };
    return map[weekday] || '好好工作，努力摸鱼 🐟';
}

function renderNews(data, body) {
    const list = Array.isArray(data) ? data : (data.news || data.list || []);
    if (!list.length) {
        body.innerHTML = `<div style="text-align:center;color:var(--text-4);font-size:13px;padding:20px 0;">暂无新闻</div>`;
        return;
    }
    body.innerHTML = `
        <div class="fade-up">
            <ul class="news-list">
                ${list.map((n, i) => `
                    <li class="news-item">
                        <span class="news-idx">${i + 1}</span>
                        <span class="news-text">${escapeHtml(n)}</span>
                    </li>`).join('')}
            </ul>
        </div>`;
}
</script>
</body>
</html>
